<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to SQL Mastery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            height: 100vh;
            margin: 0;
            padding: var(--spacing-4);
        }
        .login-container {
            width: 308px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-4);
            animation: fadeIn var(--transition);
        }
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2);
        }
        .login-header svg {
            color: var(--text);
            margin-bottom: var(--spacing-5);
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: -0.5px;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--spacing-5);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-2);
            margin-bottom: var(--spacing-4);
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 400;
        }
        .form-group input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 5px 12px;
            font-size: 0.9rem;
            line-height: 20px;
            transition: border-color var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .btn-signin {
            width: 100%;
            background-color: var(--green);
            color: #fff;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: var(--radius-sm);
            padding: 5px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition);
        }
        .btn-signin:hover {
            background-color: var(--green-hover);
        }
        .login-footer {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: var(--spacing-4) 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider span {
            padding: 0 var(--spacing-2);
        }
        .btn-google {
            width: 100%;
            background-color: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-google:hover {
            background-color: var(--bg-card-hover);
            border-color: var(--border-hover);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i data-lucide="database" style="width: 48px; height: 48px;"></i>
            <h1>Sign in to SQL Mastery</h1>
        </div>

        <div class="login-card">
            <form id="login-form">
                <div class="form-group">
                    <label for="login_field">Username or email address</label>
                    <input type="text" id="login_field" name="login" required autofocus>
                </div>
                <div class="form-group" style="position: relative;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--accent); text-decoration: none;">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-signin">Sign in</button>
            </form>
            
            <div class="divider"><span>OR</span></div>
            
            <button type="button" class="btn-google" id="btn-google-signin">
                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <div class="login-footer">
            New to SQL Mastery? <a href="#">Create an account</a>.
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('login_field').value;
            
            // Simulated login: Save username and connection status
            localStorage.setItem('sql_mastery_user', JSON.stringify({
                username: username,
                connected: true,
                bio: 'SQL enthusiast and full-stack developer.',
                links: {
                    website: 'https://' + username + '.dev',
                    twitter: '@' + username
                }
            }));

            // Redirect to home
            window.location.href = 'index.html';
        });
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDo5hIejLb5kdKisLmx1NEyGvddqWACGMg",
            authDomain: "sql-mastery-auth.firebaseapp.com",
            projectId: "sql-mastery-auth",
            storageBucket: "sql-mastery-auth.firebasestorage.app",
            messagingSenderId: "356247907572",
            appId: "1:356247907572:web:0b9badf5cfb69682f5c2a1",
            measurementId: "G-KZJ47QF6FN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('btn-google-signin').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    localStorage.setItem('sql_mastery_user', JSON.stringify({
                        username: user.displayName || 'SQL Learner',
                        connected: true,
                        email: user.email,
                        avatarUrl: user.photoURL,
                        bio: 'SQL enthusiast.',
                        links: { website: '', twitter: '' }
                    }));
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error('Auth error:', error.message);
                    alert('Could not sign in with Google!');
                });
        });
    </script>
</body>
</html>
